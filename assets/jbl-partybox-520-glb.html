<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>نمای ۳۶۰</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% 34%,#fff 0,#f2f3f4 68%,#e1e5e8 100%)}
    .fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7%;opacity:.96}
    model-viewer{position:absolute;inset:0;display:block;width:100%;height:100%;--poster-color:transparent;background:transparent;z-index:1}
  </style>
</head>
<body>
  <model-viewer src="jbl-partybox-520-v2.glb" alt="مدل سه‌بعدی اسپیکر JBL PartyBox" camera-controls touch-action="pan-y" auto-rotate rotation-per-second="18deg" camera-orbit="35deg 70deg 105%" field-of-view="28deg" exposure="1.08" shadow-intensity="1.1" shadow-softness="0.8" tone-mapping="aces" environment-image="neutral" interaction-prompt="none"></model-viewer>
</body>
</html>
