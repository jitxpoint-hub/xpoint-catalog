<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نمای سه‌بعدی آیفون ۱۷</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 48% 36%,#fff,#edf1f5 65%,#e1e7ed);color:#343f50;font:12px Tahoma,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.label{position:absolute;top:18px;right:20px;pointer-events:none}.label strong{display:block;font:600 14px Arial;margin-bottom:5px}.label small{color:#738299}.toolbar{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);display:flex;gap:5px;white-space:nowrap;padding:5px;border:1px solid white;border-radius:18px;background:#ffffffdf;box-shadow:0 8px 25px #33465c0c}button{font:inherit;cursor:pointer;color:inherit;border:0;background:transparent;border-radius:12px;padding:10px 12px}button:hover,button[aria-pressed=true]{background:#fff0e7;color:#ed601c}button:focus-visible,canvas:focus-visible{outline:2px solid #f26322;outline-offset:-3px}.hint{position:absolute;bottom:77px;left:0;right:0;text-align:center;color:#738299;font-size:10px;pointer-events:none}.error{position:absolute;inset:20%;text-align:center;line-height:2;background:white;padding:20px;border-radius:15px}.error img{width:100%;max-height:45vh;object-fit:contain}@media(max-width:360px){button{padding:10px 8px}}</style>
<canvas id="view" tabindex="0" aria-label="مدل سه‌بعدی آیفون ۱۷؛ با کشیدن یا کلیدهای جهت بچرخانید"></canvas>
<div class="label"><strong dir="ltr">iPhone 17</strong><small>Mist Blue</small></div><div class="hint">برای چرخاندن بکشید · بزرگ‌نمایی با دو انگشت</div>
<div class="toolbar" aria-label="کنترل نمای سه‌بعدی"><button id="back">پشت</button><button id="front">جلو</button><button id="auto" aria-pressed="false">چرخش خودکار</button><button id="plus" aria-label="بزرگ‌نمایی">＋</button><button id="minus" aria-label="کوچک‌نمایی">−</button><button id="reset" aria-label="بازنشانی نما">↺</button></div>
<script src="iphone-17-360.js"></script></html>
